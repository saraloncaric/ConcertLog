<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dodaj koncert - ConcertLog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
    .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .form-control, .form-select {
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
    }
    .form-control:focus, .form-select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .btn-primary { background-color: #6366f1; border-color: #6366f1; border-radius: 10px; }
    .btn-primary:hover { background-color: #4f46e5; border-color: #4f46e5; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a href="/concerts" class="navbar-brand"><i class="bi bi-music-note-beamed"></i> ConcertLog</a>
    <a href="/concerts" class="btn btn-outline-light btn-sm">
      <i class="bi bi-arrow-left"></i> Natrag
    </a>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card p-4">
        <h3 class="fw-bold mb-4"><i class="me-2"></i>Uredi koncert</h3>

        <form th:action="@{/concerts/add}" th:object="${concert}" method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Izvođač</label>
            <input type="text" class="form-control" th:field="*{izvodac}" placeholder="Npr. The Weeknd">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('izvodac')}"
                 th:errors="*{izvodac}"></div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Grad</label>
              <input type="text" class="form-control" th:field="*{grad}" placeholder="Npr. Zagreb">
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('grad')}"
                   th:errors="*{grad}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Mjesto/Dvorana</label>
              <input type="text" class="form-control" th:field="*{mjesto}" placeholder="Npr. Arena Zagreb">
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mjesto')}"
                   th:errors="*{mjesto}"></div>
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Žanr</label>
              <input type="text" class="form-control" th:field="*{zanr}" placeholder="Npr. Pop, Rock...">
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('zanr')}"
                   th:errors="*{zanr}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Datum</label>
              <input type="date" class="form-control" th:field="*{date}">
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('date')}"
                   th:errors="*{date}"></div>
            </div>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Cijena (€)</label>
              <input type="number" step="0.01" class="form-control" th:field="*{price}" placeholder="0.00">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Status</label>
              <select class="form-select" th:field="*{status}">
                <option value="">-- Odaberi status --</option>
                <option th:each="status : ${statusi}"
                        th:value="${status}"
                        th:text="${status == T(com.example.concertlog.entity.Concert.Status).PLANIRAM ? 'Planiram' :
                                                   status == T(com.example.concertlog.entity.Concert.Status).BIO_SAM ? 'Bio/la sam' :
                                                   'Propustio/la'}">
                </option>
              </select>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">
              <i class="me-1"></i> Spremi
            </button>
            <a href="/concerts" class="btn btn-outline-secondary">Odustani</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dodaj recenziju - ConcertLog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
    .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .form-control, .form-select {
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
    }
    .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .btn-success { border-radius: 10px; }
    .concert-info {
      background-color: #f1f5f9;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a href="/concerts" class="navbar-brand"><i class="bi bi-music-note-beamed"></i> ConcertLog</a>
    <a th:href="@{/concerts/{id}(id=${concert.id})}" class="btn btn-outline-light btn-sm">
      <i class="bi bi-arrow-left"></i> Natrag
    </a>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h3 class="fw-bold mb-4"><i class="bi bi-chat-quote me-2"></i>Dodaj recenziju</h3>

        <div class="concert-info">
          <div class="fw-semibold" th:text="${concert.izvodac}"></div>
          <div class="text-muted small">
            <i class="bi bi-geo-alt me-1"></i>
            <span th:text="${concert.mjesto + ', ' + concert.grad}"></span>
            &nbsp;·&nbsp;
            <i class="bi bi-calendar3 me-1"></i>
            <span th:text="${concert.date}"></span>
          </div>
        </div>

        <form th:action="@{/reviews/add/{id}(id=${concert.id})}" th:object="${review}" method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Recenzija</label>
            <textarea class="form-control" th:field="*{tekst}" rows="4"
                      placeholder="Napiši svoju recenziju..."></textarea>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tekst')}"
                 th:errors="*{tekst}"></div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Ocjena (1-5)</label>
            <input type="number" min="1" max="5" class="form-control"
                   th:field="*{ocjena}" placeholder="Npr. 4">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('ocjena')}"
                 th:errors="*{ocjena}"></div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success flex-fill">
              <i class="me-1"></i> Spremi recenziju
            </button>
            <a th:href="@{/concerts/{id}(id=${concert.id})}"
               class="btn btn-outline-secondary">Odustani</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
